<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounder Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%201024%201024'%3E%3Cdefs%3E%3ClinearGradient%20id='sfbg'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%231b1e2a'/%3E%3Cstop%20offset='1'%20stop-color='%2308080b'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='sfs'%20x1='0'%20y1='0'%20x2='.35'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ffffff'/%3E%3Cstop%20offset='1'%20stop-color='%23a9c0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='1024'%20height='1024'%20rx='228'%20fill='url(%23sfbg)'/%3E%3Cpath%20d='M650%20255C650%20160%20555%20155%20500%20155C395%20155%20345%20215%20345%20305C345%20395%20445%20428%20512%20445C595%20468%20670%20505%20670%20600C670%20695%20590%20745%20500%20745C405%20745%20345%20700%20345%20620'%20transform='translate(5%2062)'%20fill='none'%20stroke='url(%23sfs)'%20stroke-width='120'%20stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0a0c; --panel: #0d0d10; --panel2: #131317; --panel3: #1a1a20;
    --line: #232329; --line-strong: #33333c;
    --fg: #ececf1; --muted: #8b8b96; --muted2: #5f5f6b;
    --accent: #4f7cff; --ok: #3ecf8e; --warn: #e5a13a; --err: #f0647a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #4f7cff38; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2a31; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  a { color: var(--accent); }
  input, select, textarea, button {
    font: inherit; color: var(--fg); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none;
  }
  input:focus, select:focus { border-color: #3b4b6d; }
  input::placeholder { color: var(--muted2); }
  button { cursor: pointer; }
  button:hover { border-color: var(--line-strong); background: var(--panel3); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #5b86ff; }
  button.danger { background: #2a1418; border-color: #4d212a; color: #ffb3ba; }
  button.danger:hover { background: #331a1f; }
  button.sm { padding: 3px 8px; font-size: 11.5px; border-radius: 6px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* 登录 */
  #login { height: 100%; display: grid; place-items: center; padding: 20px; }
  .login-card { width: min(380px, 100%); background: #0f0f13; border: 1px solid var(--line-strong); border-radius: 12px; padding: 22px; }
  .login-card h1 { margin: 0 0 4px; font-size: 17px; }
  .login-card p { margin: 0 0 16px; color: var(--muted); font-size: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .field label { font-size: 11.5px; color: var(--muted); }
  .msg { font-size: 12px; min-height: 18px; color: var(--err); }

  /* 布局 */
  #app { display: grid; grid-template-columns: 208px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 14px 14px 12px; font-weight: 600; }
  .brand .logo { width: 22px; height: 22px; border-radius: 7px; overflow: hidden; display: block; }
  .brand .logo svg { display: block; width: 100%; height: 100%; }
  .login-logo { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 15px; overflow: hidden; }
  .login-logo svg { display: block; width: 100%; height: 100%; }
  .brand em { font-style: normal; color: var(--muted2); font-weight: 400; }
  nav { padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; }
  nav a {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 12.5px;
  }
  nav a:hover { background: #15151a; color: var(--fg); }
  nav a.on { background: #1a1a21; color: var(--fg); }
  .side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted2); }

  main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #0b0b0e; }
  .topbar h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #view { padding: 18px 20px 40px; overflow: auto; }

  /* 卡片 / 表格 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .card .s { font-size: 11px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap;
  }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #17171c; vertical-align: middle; }
  tbody tr:hover { background: #101014; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 10.5px;
    border: 1px solid var(--line-strong); color: var(--muted); background: #14141a;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .tag.ok { color: #9fe8c5; border-color: #2c5b47; background: #10221b; }
  .tag.warn { color: #f0d3a4; border-color: #5c4a20; background: #221c10; }
  .tag.err { color: #ffb3ba; border-color: #5c2630; background: #211012; }
  .empty { padding: 30px; text-align: center; color: var(--muted2); font-size: 12.5px; }
  .row-actions { display: flex; gap: 6px; }

  /* 配额弹窗 */
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: #000a; backdrop-filter: blur(3px); }
  .modal[hidden] { display: none; }
  .sheet { width: min(420px, 100%); background: #0f0f13; border: 1px solid var(--line-strong); border-radius: 12px; padding: 18px; }
  .sheet h3 { margin: 0 0 4px; font-size: 15px; }
  .sheet .sub { margin: 0 0 14px; color: var(--muted); font-size: 11.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 10px);
    z-index: 60; padding: 7px 13px; border-radius: 999px; font-size: 12px;
    background: #15151b; border: 1px solid var(--line-strong); color: var(--fg);
    box-shadow: 0 10px 30px #0009; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 92vw);
    background: #0d0d11; border-left: 1px solid var(--line-strong); display: flex; flex-direction: column;
    box-shadow: -20px 0 60px #000a;
  }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer-title { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  .drawer-head button { margin-left: auto; }
  .drawer-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .dm-msg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #101014; }
  .dm-msg .who { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted2); margin-bottom: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dm-msg .txt { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.6; }
  .dm-msg.user { border-color: #2b3a5c; background: #101725; }
  .dm-msg.tool { border-left: 2px solid var(--line-strong); color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 210px; z-index: 20; transform: translateX(-101%); transition: transform .18s; }
    body.menu aside { transform: translateX(0); }
    #menuBtn { display: inline-block; }
    #view { padding: 12px; }
  }
  #menuBtn { display: none; }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <div class="login-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1e2a"/><stop offset="1" stop-color="#08080b"/></linearGradient><linearGradient id="ls" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9c0ff"/></linearGradient></defs><rect width="1024" height="1024" rx="228" fill="url(#lbg)"/><path d="M650 255C650 160 555 155 500 155C395 155 345 215 345 305C345 395 445 428 512 445C595 468 670 505 670 600C670 695 590 745 500 745C405 745 345 700 345 620" transform="translate(5 62)" fill="none" stroke="url(#ls)" stroke-width="120" stroke-linecap="round"/></svg></div>
    <h1>Sounder Admin</h1>
    <p>用管理员账号登录控制面。</p>
    <div class="field"><label>邮箱</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="msg" id="loginMsg"></div>
    <button class="primary" type="submit" id="loginBtn" style="width:100%">登录</button>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1e2a"/><stop offset="1" stop-color="#08080b"/></linearGradient><linearGradient id="hs" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9c0ff"/></linearGradient></defs><rect width="1024" height="1024" rx="228" fill="url(#hbg)"/><path d="M650 255C650 160 555 155 500 155C395 155 345 215 345 305C345 395 445 428 512 445C595 468 670 505 670 600C670 695 590 745 500 745C405 745 345 700 345 620" transform="translate(5 62)" fill="none" stroke="url(#hs)" stroke-width="120" stroke-linecap="round"/></svg></span><span>Sound<em>er</em> admin</span></div>
    <nav id="nav">
      <a href="#/overview" data-view="overview">概览</a>
      <a href="#/users" data-view="users">用户</a>
      <a href="#/devices" data-view="devices">设备</a>
      <a href="#/sessions" data-view="sessions">会话</a>
      <a href="#/workers" data-view="workers">Worker</a>
      <a href="#/audit" data-view="audit">审计</a>
    </nav>
    <div class="side-foot mono" id="buildInfo">Sounder Admin</div>
  </aside>
  <main>
    <div class="topbar">
      <button id="menuBtn" class="sm" type="button">☰</button>
      <h2 id="title">概览</h2>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="sm" id="logout" type="button">退出</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="quotaModal" hidden>
  <div class="sheet">
    <h3>调整配额</h3>
    <p class="sub" id="quotaWho"></p>
    <div class="grid2">
      <div class="field"><label>云端设备数</label><input id="qMaxDevices" type="number" min="1"></div>
      <div class="field"><label>vCPU</label><input id="qCpu" type="number" min="1"></div>
      <div class="field"><label>内存 MB</label><input id="qMem" type="number" min="512"></div>
      <div class="field"><label>磁盘 GB</label><input id="qDisk" type="number" min="1"></div>
    </div>
    <div class="actions">
      <button type="button" id="qCancel">取消</button>
      <button class="primary" type="button" id="qSave">保存</button>
    </div>
  </div>
</div>

<div id="drawer" hidden>
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="drawerTitle">会话</div>
      <div class="mono" id="drawerSub" style="font-size:11px;color:var(--muted2)"></div>
    </div>
    <button class="sm" id="drawerClose" type="button">关闭</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "sounder.admin.token";
const state = {
  token: localStorage.getItem(TOKEN_KEY) || "",
  me: null,
  view: "overview",
  quotaUser: null,
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try {
      const text = await res.text();
      if (text) { try { msg = JSON.parse(text).error || text; } catch { msg = text; } }
    } catch {}
    throw new ApiError(msg, res.status);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}

// ---------- 登录 ----------
function showLogin(msg = "") {
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginMsg").textContent = msg;
}

async function login(e) {
  e.preventDefault();
  $("loginBtn").disabled = true;
  $("loginMsg").textContent = "";
  try {
    const r = await api("/v1/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    });
    state.token = r.token;
    localStorage.setItem(TOKEN_KEY, r.token);
    await enter();
  } catch (err) {
    $("loginMsg").textContent = err.message || "登录失败";
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function enter() {
  try {
    state.me = await api("/v1/auth/me");
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
    state.token = "";
    showLogin("登录已过期，请重新登录");
    return;
  }
  const isAdmin = state.me.admin || (state.me.user && state.me.user.isAdmin);
  if (!isAdmin) {
    localStorage.removeItem(TOKEN_KEY);
    state.token = "";
    showLogin("该账号不是管理员");
    return;
  }
  $("login").hidden = true;
  $("app").hidden = false;
  $("who").textContent = state.me.user.email || state.me.user.id;
  route();
}

$("loginForm").onsubmit = login;
$("logout").onclick = async () => {
  try { await api("/v1/auth/logout", { method: "POST" }); } catch {}
  localStorage.removeItem(TOKEN_KEY);
  state.token = "";
  showLogin("");
};

// ---------- 路由 ----------
const TITLES = { overview: "概览", users: "用户", devices: "设备", sessions: "会话", workers: "Worker", audit: "审计" };

function route() {
  const v = (location.hash.replace("#/", "") || "overview").split("?")[0];
  state.view = TITLES[v] ? v : "overview";
  $("title").textContent = TITLES[state.view];
  for (const a of document.querySelectorAll("#nav a")) a.classList.toggle("on", a.dataset.view === state.view);
  document.body.classList.remove("menu");
  render().catch((e) => {
    $("view").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  });
}

async function render() {
  if (state.view === "overview") return renderOverview();
  if (state.view === "users") return renderUsers();
  if (state.view === "devices") return renderDevices();
  if (state.view === "sessions") return renderSessions();
  if (state.view === "audit") return renderAudit();
  return renderWorkers();
}

window.addEventListener("hashchange", route);
$("menuBtn").onclick = () => document.body.classList.toggle("menu");

// ---------- 概览 ----------
async function renderOverview() {
  const s = await api("/v1/admin/stats");
  const online = s.devices ? Math.round((s.onlineDevices / s.devices) * 100) : 0;
  $("view").innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">用户</div><div class="v">${s.users}</div><div class="s">账号总数</div></div>
      <div class="card"><div class="k">设备</div><div class="v">${s.devices}</div><div class="s">${s.onlineDevices} 在线 · 云端 ${s.cloudDevices}</div></div>
      <div class="card"><div class="k">在线率</div><div class="v">${online}%</div><div class="s">设备在线比例</div></div>
      <div class="card"><div class="k">会话</div><div class="v">${s.sessions}</div><div class="s">控制面记录</div></div>
      <div class="card"><div class="k">Worker</div><div class="v">${s.workers}</div><div class="s">网关在线</div></div>
    </div>
    <div class="card">
      <div class="k">说明</div>
      <div class="s" style="margin-top:8px;line-height:1.7">
        设备是用户绑定的 Worker 运行环境；云端设备由 provisioner 按配额创建。<br>
        左侧可以查看用户、设备、会话与网关上在线的 Worker。
      </div>
    </div>`;
}

// ---------- 用户 ----------
async function renderUsers() {
  const data = await api("/v1/admin/users?limit=100");
  const rows = (data.users || []).map((u) => `
    <tr>
      <td><div>${esc(u.email || "—")}</div><div class="mono" style="color:var(--muted2);font-size:11px">${esc(u.id)}</div></td>
      <td>${esc(u.displayName || "—")}</td>
      <td>${u.isAdmin ? '<span class="tag warn">admin</span>' : '<span class="tag">user</span>'} ${u.status === "disabled" ? '<span class="tag err">已禁用</span>' : ""}</td>
      <td>${u.deviceCount} <span style="color:var(--muted2)">/ 云端 ${u.cloudDevices}</span></td>
      <td class="mono">${u.quota ? `${u.quota.maxDevices} 台 · ${u.quota.deviceCpu}C/${Math.round(u.quota.deviceMemMb / 1024)}G/${u.quota.deviceDiskGb}G` : "—"}</td>
      <td>${(u.createdAt || "").slice(0, 10)}</td>
      <td class="row-actions">
        <button class="sm" data-quota="${esc(u.id)}">配额</button>
        <button class="sm" data-toggle-admin="${esc(u.id)}" data-admin="${u.isAdmin ? 1 : 0}">${u.isAdmin ? "取消管理员" : "设为管理员"}</button>
        <button class="sm" data-toggle-status="${esc(u.id)}" data-status="${esc(u.status || "active")}">${u.status === "disabled" ? "启用" : "禁用"}</button>
        <button class="sm danger" data-del-user="${esc(u.id)}">删除</button>
      </td>
    </tr>`).join("");
  $("view").innerHTML = `
    <table>
      <thead><tr><th>用户</th><th>昵称</th><th>角色</th><th>设备</th><th>配额</th><th>注册</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">还没有用户</td></tr>'}</tbody>
    </table>
    <p class="mono" style="color:var(--muted2);font-size:11px;margin-top:10px">共 ${data.total} 个用户</p>`;
  const findUser = (id) => (data.users || []).find((u) => u.id === id);
  for (const btn of $("view").querySelectorAll("[data-quota]")) {
    btn.onclick = () => openQuota(findUser(btn.dataset.quota));
  }
  for (const btn of $("view").querySelectorAll("[data-toggle-admin]")) {
    btn.onclick = () => patchUser(btn.dataset.toggleAdmin, { isAdmin: btn.dataset.admin !== "1" }, btn);
  }
  for (const btn of $("view").querySelectorAll("[data-toggle-status]")) {
    btn.onclick = () => patchUser(
      btn.dataset.toggleStatus,
      { status: btn.dataset.status === "disabled" ? "active" : "disabled" },
      btn,
    );
  }
  for (const btn of $("view").querySelectorAll("[data-del-user]")) {
    btn.onclick = async () => {
      if (!confirm("删除该用户？其会话、身份与设备绑定会一起清理。")) return;
      btn.disabled = true;
      try {
        await api(`/v1/admin/users/${encodeURIComponent(btn.dataset.delUser)}`, { method: "DELETE" });
        toast("用户已删除");
        render();
      } catch (e) {
        toast(e.message || "删除失败");
        btn.disabled = false;
      }
    };
  }
}

async function patchUser(id, body, btn) {
  btn.disabled = true;
  try {
    await api(`/v1/admin/users/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(body) });
    toast("已更新");
    render();
  } catch (e) {
    toast(e.message || "更新失败");
    btn.disabled = false;
  }
}

// ---------- 审计 ----------
async function renderAudit() {
  const data = await api("/v1/admin/audit?limit=200");
  const rows = (data.events || []).map((e) => `
    <tr>
      <td class="mono">${(e.createdAt || "").slice(0, 19).replace("T", " ")}</td>
      <td>${esc(e.userEmail || e.userId || "—")}</td>
      <td><span class="tag">${esc(e.action)}</span></td>
      <td class="mono">${esc(e.ip || "—")}</td>
      <td class="mono" style="color:var(--muted2);font-size:11px">${esc(e.detail ? JSON.stringify(e.detail).slice(0, 120) : "")}</td>
    </tr>`).join("");
  $("view").innerHTML = `
    <table>
      <thead><tr><th>时间</th><th>用户</th><th>动作</th><th>IP</th><th>详情</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">还没有审计记录</td></tr>'}</tbody>
    </table>`;
}

function openQuota(user) {
  if (!user) return;
  state.quotaUser = user;
  $("quotaWho").textContent = user.email || user.id;
  $("qMaxDevices").value = user.quota.maxDevices;
  $("qCpu").value = user.quota.deviceCpu;
  $("qMem").value = user.quota.deviceMemMb;
  $("qDisk").value = user.quota.deviceDiskGb;
  $("quotaModal").hidden = false;
}

$("qCancel").onclick = () => { $("quotaModal").hidden = true; };
$("quotaModal").onclick = (e) => { if (e.target === $("quotaModal")) $("quotaModal").hidden = true; };
$("qSave").onclick = async () => {
  const u = state.quotaUser;
  if (!u) return;
  $("qSave").disabled = true;
  try {
    await api("/v1/quota", {
      method: "PUT",
      body: JSON.stringify({
        userId: u.id,
        maxDevices: Number($("qMaxDevices").value) || 0,
        deviceCpu: Number($("qCpu").value) || 0,
        deviceMemMb: Number($("qMem").value) || 0,
        deviceDiskGb: Number($("qDisk").value) || 0,
      }),
    });
    $("quotaModal").hidden = true;
    toast("配额已更新");
    render();
  } catch (e) {
    toast(e.message || "更新失败");
  } finally {
    $("qSave").disabled = false;
  }
};

// ---------- 设备 ----------
const FORM_LABEL = { computer: "Computer", sandbox: "Sandbox" };

async function renderDevices() {
  const data = await api("/v1/admin/devices");
  const rows = (data.devices || []).map((d) => `
    <tr>
      <td><div>${esc(d.name || d.workerId)}</div><div class="mono" style="color:var(--muted2);font-size:11px">${esc(d.workerId)}</div></td>
      <td>${esc(d.ownerEmail || d.userId)}</td>
      <td><span class="tag">${esc(d.kind)}</span> <span class="tag">${FORM_LABEL[d.form] || esc(d.form)}</span></td>
      <td><span class="dot ${d.status === "online" ? "on" : ""}"></span>${d.status === "online" ? "在线" : "离线"}</td>
      <td class="mono">${d.capacity ? d.used + "/" + d.capacity : "—"}</td>
      <td class="mono">${(d.lastSeenAt || "").slice(0, 16).replace("T", " ")}</td>
      <td class="row-actions">
        ${d.kind === "cloud" ? `<button class="sm" data-power="${esc(d.id)}" data-online="${d.status === "online" ? 1 : 0}">${d.status === "online" ? "关机" : "开机"}</button>
        <button class="sm danger" data-del="${esc(d.id)}">删除</button>` : '<span class="mono" style="color:var(--muted2);font-size:11px">客户端管理</span>'}
      </td>
    </tr>`).join("");
  $("view").innerHTML = `
    <table>
      <thead><tr><th>设备</th><th>归属</th><th>类型</th><th>状态</th><th>占用</th><th>最近活跃</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">还没有设备</td></tr>'}</tbody>
    </table>`;

  for (const btn of $("view").querySelectorAll("[data-power]")) {
    btn.onclick = async () => {
      const online = btn.dataset.online === "1";
      btn.disabled = true;
      try {
        await api(`/v1/devices/${encodeURIComponent(btn.dataset.power)}/${online ? "stop" : "start"}`, { method: "POST" });
        toast(online ? "正在关机…" : "正在开机…");
        setTimeout(render, 2000);
      } catch (e) {
        toast(e.message || "操作失败");
        btn.disabled = false;
      }
    };
  }
  for (const btn of $("view").querySelectorAll("[data-del]")) {
    btn.onclick = async () => {
      if (!confirm("删除该设备？云端设备会连同容器/卷一起回收。")) return;
      btn.disabled = true;
      try {
        await api(`/v1/devices/${encodeURIComponent(btn.dataset.del)}`, { method: "DELETE" });
        toast("已删除");
        render();
      } catch (e) {
        toast(e.message || "删除失败");
        btn.disabled = false;
      }
    };
  }
}

// ---------- 会话 ----------
async function renderSessions() {
  const data = await api("/v1/admin/sessions");
  const rows = (data.sessions || []).map((s) => `
    <tr>
      <td class="mono">${esc(s.id)}</td>
      <td>${esc(s.ownerEmail || s.ownerId || "—")}</td>
      <td class="mono">${esc(s.workerId)}</td>
      <td>${esc(s.model || "—")}</td>
      <td><span class="tag ${s.state === "running" ? "warn" : "ok"}">${esc(s.state)}</span></td>
      <td class="mono">${(s.createdAt || "").slice(0, 16).replace("T", " ")}</td>
      <td class="row-actions">
        <button class="sm" data-sview="${esc(s.id)}">查看</button>
        <button class="sm danger" data-sdel="${esc(s.id)}">删除</button>
      </td>
    </tr>`).join("");
  $("view").innerHTML = `
    <table>
      <thead><tr><th>会话</th><th>归属</th><th>设备</th><th>模型</th><th>状态</th><th>创建</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">还没有会话</td></tr>'}</tbody>
    </table>`;
  for (const btn of $("view").querySelectorAll("[data-sview]")) {
    btn.onclick = () => openSession((data.sessions || []).find((x) => x.id === btn.dataset.sview));
  }
  for (const btn of $("view").querySelectorAll("[data-sdel]")) {
    btn.onclick = async () => {
      if (!confirm("删除该会话？")) return;
      btn.disabled = true;
      try {
        await api(`/v1/sessions/${encodeURIComponent(btn.dataset.sdel)}`, { method: "DELETE" });
        toast("已删除");
        render();
      } catch (e) {
        toast(e.message || "删除失败");
        btn.disabled = false;
      }
    };
  }
}

// ---------- 会话详情 ----------
async function openSession(sess) {
  if (!sess) return;
  $("drawer").hidden = false;
  $("drawerTitle").textContent = sess.id;
  $("drawerSub").textContent = `${sess.ownerEmail || sess.ownerId || "—"} · ${sess.workerId} · ${(sess.createdAt || "").slice(0, 19).replace("T", " ")}`;
  $("drawerBody").innerHTML = '<div class="empty">加载中…</div>';
  try {
    const data = await api(`/v1/sessions/${encodeURIComponent(sess.id)}/history?limit=200`);
    const msgs = data.messages || [];
    if (!msgs.length) {
      $("drawerBody").innerHTML = '<div class="empty">这段会话还没有消息</div>';
      return;
    }
    $("drawerBody").innerHTML = msgs.map((m) => {
      if (m.role === "toolResult") {
        return `<div class="dm-msg tool">${esc(m.tool || "tool")} · ${m.isError ? "失败" : "完成"}${m.text ? " · " + esc(String(m.text).slice(0, 400)) : ""}</div>`;
      }
      const cls = m.role === "user" ? "user" : "";
      const who = m.role === "user" ? "你" : m.role === "assistant" ? "Agent" : m.role;
      return `<div class="dm-msg ${cls}"><div class="who">${esc(who)}</div><div class="txt">${esc(m.text || "")}</div></div>`;
    }).join("");
  } catch (e) {
    $("drawerBody").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

$("drawerClose").onclick = () => { $("drawer").hidden = true; };

// ---------- Worker ----------
async function renderWorkers() {
  const data = await api("/v1/workers");
  const rows = (data.workers || []).map((w) => `
    <tr>
      <td class="mono">${esc(w.id)}</td>
      <td><span class="tag">${esc(w.kind)}</span></td>
      <td class="mono">${esc(w.version || "—")}</td>
      <td class="mono">${w.used}/${w.capacity}</td>
      <td class="mono">${esc(w.remoteAddr || "—")}</td>
      <td class="mono">${(w.connectedAt || "").slice(0, 16).replace("T", " ")}</td>
    </tr>`).join("");
  $("view").innerHTML = `
    <table>
      <thead><tr><th>Worker</th><th>类型</th><th>版本</th><th>占用</th><th>来源</th><th>连接时间</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">网关上没有在线 Worker</td></tr>'}</tbody>
    </table>`;
}

// ---------- 启动 ----------
if (state.token) {
  enter();
} else {
  showLogin("");
}
</script>
